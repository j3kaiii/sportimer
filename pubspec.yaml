name: sportimer
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.1.0
  hive: ^2.2.3
  flutter_custom_theme: ^0.2.1
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  multiple_localization: ^0.6.0
  uuid: ^4.5.1
  hive_flutter: ^1.1.0
  wheel_chooser: ^1.1.2
  just_audio: ^0.10.5
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  bloc: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_translation: ^0.20.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/timer.png
    - assets/sounds/
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

alex:
  l10n:
    base_locale_for_xml: ru
    xml_output_dir: lib/application/l10n/translations
    translation_files_pattern: intl_{locale}.arb
    source_file: lib/application/localizations.dart
    output_dir: lib/application/l10n
